# ============================================================
#  Pipeline 全局默认值
#  所有 Pipeline 的节点继承这些默认参数，除非显式覆盖。
# ============================================================

defaults:
  # 识别轮询间隔 (ms) — 控制截屏频率，避免过度占用 CPU
  rate_limit: 1000

  # next 列表扫描超时 (ms) — 超时后触发 on_error 链
  timeout: 15000

  # 动作前延迟 [min, max] ms — 人性化随机，模拟真人操作间隔
  pre_delay: [200, 800]

  # 动作后延迟 [min, max] ms — 防止连续快速操作触发风控
  post_delay: [300, 1000]
